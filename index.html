<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>华容道</title>
    <link rel="stylesheet" href="./style.css?v=1" />
  </head>
  <body>
    <h2>华容道</h2>
    <div>
      第 <span id="levelNum">1</span> 关　 步数: <span id="steps">0</span>
    </div>
    <div id="outer">
      <div id="board"></div>
    </div>

    <div id="controls">
      <button onclick="undo()">回退</button>
      <button onclick="resetGame()">重置</button>
      <button onclick="openLevelSelect()">选关</button>
    </div>

    <div id="levelSelect">
      <img src="./images/levels.png" id="levelImage" />
    </div>
    <script src="./levels.js?v=1"></script>
    <script src="./game.js?v=1"></script>
  </body>
</html>
