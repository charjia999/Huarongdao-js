<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>华容道</title>
    <link rel="stylesheet" href="./style.css?v=1" />
  </head>
  <body>
    <div id="header">
      <h2 id="title"></h2>

      <div id="langSwitch">
        <button onclick="setLang('zh')">中</button>
        <button onclick="setLang('en')">EN</button>
      </div>
    </div>

    <div>
      <span id="levelText"></span>
      <span id="stepsText"></span>: <span id="steps">0</span>
    </div>

    <div id="outer">
      <div id="board"></div>
    </div>

    <div id="controls">
      <button id="undoBtn" onclick="undo()"></button>
      <button id="resetBtn" onclick="resetGame()"></button>
      <button id="selectBtn" onclick="openLevelSelect()"></button>
    </div>

    <div id="levelSelect">
      <img src="./images/levels.png" id="levelImage" />
    </div>
    <script src="./levels.js?v=1"></script>
    <script src="./i18n.js?v=1"></script>
    <script src="./game.js?v=1"></script>
  </body>
</html>
